<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KChart Dual-Axis Combo Basic</title>
  </head>
  <body>
    <main class="report-shell">
      <header class="report-header">
        <div>
          <p class="eyebrow">Commercial operations</p>
          <h1>Pipeline value and win rate</h1>
          <p>Monthly qualified pipeline alongside the share converted to signed business.</p>
        </div>
        <aside class="period" aria-label="Reporting period">
          <span>Reporting period</span>
          <strong>FY 2026</strong>
        </aside>
      </header>
      <section class="chart-panel" aria-label="Pipeline value and win rate chart">
        <div id="chart"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
