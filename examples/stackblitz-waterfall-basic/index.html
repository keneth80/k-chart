<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KChart Waterfall Basic</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="eyebrow">Finance review</p>
        <h1>Q2 operating profit bridge</h1>
        <p>Movement from first-quarter operating profit to the second-quarter result, in USD millions.</p>
      </header>
      <section class="chart-panel">
        <div class="data-key" aria-label="Bar colors">
          <span><i style="--key-color:#34d399"></i>Increase</span>
          <span><i style="--key-color:#fb7185"></i>Decrease</span>
          <span><i style="--key-color:#38bdf8"></i>Total</span>
        </div>
        <div id="chart"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
